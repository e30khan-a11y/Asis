name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      working-directory: voice_agent_android
      run: |
        gradle clean assembleDebug
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/VoiceAgent_v2_ENGLISH.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceAgent-v2-ENGLISH-NEW
        path: voice_agent_android/app/build/outputs/apk/debug/VoiceAgent_v2_ENGLISH.apk
